target-version = "py311"
line-length = 100

[lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "SIM", # flake8-simplify
  "TCH", # flake8-type-checking
  "RUF", # ruff-specific rules
]
ignore = [
  "E501",  # line-length (handled by formatter)
  "UP007", # use X | Y for union (keep Optional for 3.11 compat)
  "TC003", # move stdlib import into TYPE_CHECKING — too invasive
  "B017",  # assert blind exception in tests is fine
]

[lint.isort]
known-first-party = ["motosan_ai"]

[format]
quote-style = "double"
indent-style = "space"
