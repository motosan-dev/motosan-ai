[project]
name = "motosan-ai"
version = "0.16.0"
description = "Python SDK for Anthropic, OpenAI, MiniMax, Gemini, Ollama, and CLI AI providers"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "motosan-dev" }]
keywords = ["ai", "llm", "anthropic", "openai", "minimax", "tool-use"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
]
dependencies = ["httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/motosan-dev/motosan-ai"
Repository = "https://github.com/motosan-dev/motosan-ai"

[project.optional-dependencies]
anthropic = ["httpx>=0.27"]
openai = ["httpx>=0.27"]
minimax = ["httpx>=0.27"]
ollama = ["httpx>=0.27"]
gemini = ["httpx>=0.27"]
full = ["motosan-ai[anthropic,openai,minimax,ollama,gemini]"]

dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.9"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["."]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"
