[project]
name = "motosan-ai"
version = "0.1.0"
description = "Multi-provider AI SDK — Anthropic, OpenAI, MiniMax with a unified interface"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["ai", "llm", "anthropic", "openai", "minimax", "sdk"]
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai    = ["openai>=1.50"]
minimax   = []              # uses httpx (already in core deps)
all       = ["motosan-ai[anthropic,openai]"]
dev       = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=4.1", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
