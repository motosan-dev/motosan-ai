[project]
name = "motosan-ai"
version = "0.3.1"
description = "Python SDK for Anthropic, OpenAI, and MiniMax AI providers"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "motosan-dev" }]
keywords = ["ai", "llm", "anthropic", "openai", "minimax", "tool-use"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
]
dependencies = [
  "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/motosan-dev/motosan-ai"
Repository = "https://github.com/motosan-dev/motosan-ai"

[project.optional-dependencies]
anthropic = ["anthropic>=0.49"]
openai = ["openai>=1.70"]
minimax = ["httpx>=0.27"]
ollama = ["openai>=1.70"]
full = ["motosan-ai[anthropic,openai,minimax,ollama]"]

dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "ruff>=0.9",
]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"
