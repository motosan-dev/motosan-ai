[project]
name = "motosan-ai"
version = "0.18.0"
description = "Python SDK for Anthropic, OpenAI, MiniMax, Gemini, Ollama, and CLI AI providers"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "motosan-dev" }]
keywords = ["ai", "llm", "anthropic", "openai", "minimax", "tool-use"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/motosan-dev/motosan-ai"
Repository = "https://github.com/motosan-dev/motosan-ai"

# The per-provider extras are compatibility aliases: every provider uses the
# core httpx dependency, so `motosan-ai[anthropic]` == `motosan-ai`. Kept so
# existing install commands don't break.
[project.optional-dependencies]
anthropic = ["httpx>=0.27"]
openai = ["httpx>=0.27"]
minimax = ["httpx>=0.27"]
ollama = ["httpx>=0.27"]
gemini = ["httpx>=0.27"]
full = ["motosan-ai[anthropic,openai,minimax,ollama,gemini]"]

dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "ruff>=0.9",
  "mypy>=1.14",
]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["."]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"
