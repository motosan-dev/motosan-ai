[project]
name = "motosan-ai"
version = "0.2.0"
description = "Python SDK for Motosan AI providers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.49"]
openai = ["openai>=1.70"]
minimax = ["httpx>=0.27"]
full = ["motosan-ai[anthropic,openai,minimax]"]

dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"
