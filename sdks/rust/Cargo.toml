[package]
name = "motosan-ai"
version = "0.15.2"
edition = "2021"
rust-version = "1.82"
license = "MIT"
description = "Rust SDK for multi-provider AI chat"
repository = "https://github.com/motosan-dev/motosan-ai"
homepage = "https://github.com/motosan-dev/motosan-ai"
documentation = "https://docs.rs/motosan-ai"
readme = "README.md"
keywords = ["ai", "llm", "anthropic", "openai", "minimax"]
categories = ["api-bindings", "asynchronous"]

[features]
default = []
anthropic = [
  "dep:reqwest",
  "dep:eventsource-stream",
  "dep:tokio-stream",
  "dep:tokio",
]
openai = [
  "dep:reqwest",
  "dep:eventsource-stream",
  "dep:tokio-stream",
  "dep:tokio",
]
minimax = ["anthropic"]
ollama = [
  "openai",
  "dep:reqwest",
  "dep:tokio",
  "dep:tokio-stream",
  "dep:bytes",
]
# Retained as an alias for backwards compatibility. The `ollama_native(true)`
# runtime flag still controls explicit routing — see ClientBuilder::ollama_native.
# As of 0.15.0 the OllamaProvider (/api/chat) is also auto-selected whenever
# ollama_think / ollama_keep_alive / ollama_num_ctx is set, regardless of this
# feature, because Ollama's OpenAI-compat endpoint silently drops those fields.
ollama_native = ["ollama"]
claude-code = ["dep:tokio", "dep:tokio-stream", "dep:async-stream"]
codex-cli = ["dep:tokio", "dep:tokio-stream", "dep:async-stream"]
gemini-cli = ["dep:tokio", "dep:tokio-stream", "dep:async-stream"]
gemini = [
  "dep:reqwest",
  "dep:eventsource-stream",
  "dep:tokio-stream",
  "dep:tokio",
]
gemini-code-assist = [
  "gemini",
  "dep:reqwest",
  "dep:eventsource-stream",
  "dep:tokio-stream",
  "dep:tokio",
]
agent-tool = ["dep:motosan-agent-tool"]
full = [
  "anthropic",
  "openai",
  "minimax",
  "ollama",
  "ollama_native",
  "gemini",
  "gemini-code-assist",
]

[dependencies]
async-trait = "0.1"
futures-core = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
thiserror = "2"

motosan-agent-tool = { version = "0.3", optional = true }
bytes = { version = "1", optional = true }
reqwest = { version = "0.12", optional = true, features = [
  "json",
  "stream",
  "rustls-tls",
] }
eventsource-stream = { version = "0.2", optional = true }
tokio-stream = { version = "0.1", optional = true }
tokio = { version = "1", optional = true, features = [
  "time",
  "process",
  "io-util",
] }
async-stream = { version = "0.3", optional = true }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt"] }
tokio-stream = "0.1"
mockito = "1"
