name: ci-python

on:
  push:
    paths:
      - "sdks/python/**"
      - ".github/workflows/ci-python.yml"
  pull_request:
    paths:
      - "sdks/python/**"
      - ".github/workflows/ci-python.yml"

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Sync deps
        run: uv sync --extra full --extra dev
      - name: Test
        run: uv run pytest -q
