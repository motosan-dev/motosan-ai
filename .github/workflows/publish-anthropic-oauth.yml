name: publish-anthropic-oauth

on:
  push:
    tags:
      - "anthropic-oauth-v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    # Trusted Publishing: crates.io mints a short-lived token from this
    # workflow's OIDC identity, so no long-lived registry secret exists.
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: sdks/rust/crates/anthropic-oauth
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sdks/rust/crates/anthropic-oauth
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish
