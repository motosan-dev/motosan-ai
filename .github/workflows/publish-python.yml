name: publish-python

on:
  push:
    tags: ["python-v*"]
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    # Trusted Publishing: PyPI authenticates this workflow's OIDC identity,
    # so no API token is stored or passed.
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Verify tag matches pyproject.toml version
        run: |
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
            expected_tag="python-v${version}"
            if [ "${GITHUB_REF_NAME:-}" != "$expected_tag" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME:-<none>} does not match pyproject.toml version ${expected_tag}"
              exit 1
            fi
          fi
      - name: Sync deps
        run: uv sync --all-extras
      - name: Lint
        run: uv run ruff check motosan_ai/
      - name: Format check
        run: uv run ruff format --check motosan_ai/ tests/
      - name: Unit tests
        run: uv run pytest tests/ -q --ignore=tests/integration/
      - name: Build
        run: uv build --out-dir dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdks/python/dist/
