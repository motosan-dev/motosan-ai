name: ci-python-nightly

on:
  # No schedule: live provider tests never run automatically in CI.
  # Manual dispatch only, and only meaningful when the provider API-key
  # secrets are configured (without them every live test silently skips).
  workflow_dispatch: {}

jobs:
  live:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Sync deps
        run: uv sync --extra full --extra dev
      - name: Run live integration tests
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: uv run pytest tests/integration/ -v
